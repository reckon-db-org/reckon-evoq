# Runs reckon-evoq's checks on the pinned OTP 28, so a change to the adapter
# between evoq and reckon-gater shows here before a consumer pulls it in.
# Nothing here publishes; releases go through publish-hex.yml.
#
# Shaped after reckon-gater's, which adopted these two decisions from its own
# unmerged CI branch; they hold here for the same reasons:
#
#   1. NEVER CACHE `_build', only the hex package cache and dialyzer's PLTs,
#      because rebar.lock is untracked so a cached build can serve stale deps.
#   2. rebar3 BY DIRECT DOWNLOAD against the sha256 GitHub publishes, because
#      setup-beam's own rebar3 lookup has failed on the releases pagination cap.
#
# ⚠ `branches: ['**']' IS LOAD-BEARING: a `push' event fires for TAG refs too,
# so without it this suite runs a second time on every release tag beside
# publish-hex.yml. Same defect fixed in evoq (c589fcc) and macula (7edc84d2).
#
# ⚠ DIALYZER IS A RATCHET. 31 findings arrived with the repo, recorded in
# `.dialyzer_baseline'. `scripts/check_ratchet.sh' fails only on a finding that
# is NOT in that file, and reports one that has been fixed so its line can be
# struck. Main can be green while the debt stays counted and can only shrink.
# Do NOT add continue-on-error, and do not regenerate the baseline to make a
# new finding go away: --update is for recording a finding somebody decided to
# accept, in a commit that says why.
#
# Two notes on what is NOT here. There is no PropEr step: rebar3_proper is not
# a plugin of this repository, unlike reckon-gater and reckon-db. And `rebar3
# ct' currently reports "All 0 tests passed" because there are no suites yet;
# it is kept so the first suite added is run rather than forgotten. Lint passes
# outright here, so it has no baseline.
name: lint-and-test

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'assets/**'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'assets/**'
      - 'doc/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # From .tool-versions, which is what a developer's shell resolves here.
  OTP_VERSION: '28.4.3'
  REBAR3_VERSION: '3.27.0'
  REBAR3_SHA256: 'af85aab41f9fd74bdd6341ebdf6fe9c88077aab9f8eac82371583fa02f2b0bdf'

# A newer push to the same branch supersedes a running check, except on main,
# where every commit keeps its own result.
concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: compile + xref + lint + eunit + ct + dialyzer (OTP 28.4.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          curl -fsSL -o rebar3 "https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3"
          echo "${REBAR3_SHA256}  rebar3" | sha256sum --check --strict -
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3
          rebar3 version

      - name: Cache hex packages and PLTs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build/default/*_plt
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('rebar.config') }}

      - name: Compile
        id: compile
        run: rebar3 compile

      # Once the code compiles, every check runs even when an earlier one
      # failed, so one run reports all failures. The job still fails if any
      # check fails.
      - name: Xref
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 xref

      - name: Lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 lint

      # The package and its docs, exactly as publish-hex.yml builds them.
      # edoc/ex_doc run only here and at publish time; a docs break (2.7.1:
      # a dangling @private) otherwise surfaced only after the tag.
      - name: Package and docs build (as at publish)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 hex build

      - name: EUnit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 eunit

      - name: Common Test
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: rebar3 ct

      - name: Dialyzer (ratchet against .dialyzer_baseline)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: bash scripts/check_ratchet.sh
